name: Web quality
on: [push, pull_request, workflow_dispatch]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run scan:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
